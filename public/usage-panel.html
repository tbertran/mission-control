<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude usage</title>
    <style>
      :root {
        --bg: #14161c; --panel: #1b1e26; --line: #2b303c; --tx: #e7eaf0; --dim: #8b93a6;
        --fill: #4a90e2; --track: #2a2f3a; --now: #ffffff; --hot: #e2685c;
        --warn: #e0a24e; --good: #4a90e2;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        background: var(--bg); color: var(--tx); width: 340px;
        font: 13px/1.45 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        user-select: none; overflow: hidden;
      }
      .bar-drag { -webkit-app-region: drag; }
      header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 8px 12px; border-bottom: 1px solid var(--line);
      }
      header .title { font-weight: 600; font-size: 12px; letter-spacing: 0.3px; }
      header .btns { display: flex; gap: 10px; -webkit-app-region: no-drag; }
      header .btns span { color: var(--dim); cursor: pointer; font-size: 13px; }
      header .btns span:hover { color: var(--tx); }
      .account { padding: 10px 12px 4px; }
      .account .row { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); }
      .account .row b { color: var(--tx); font-weight: 500; }
      section { padding: 8px 12px; }
      .lim { margin-bottom: 12px; }
      .lim:last-child { margin-bottom: 2px; }
      .lim .top { display: flex; justify-content: space-between; align-items: baseline; }
      .lim .lbl { font-size: 12px; }
      .lim .pc { font-weight: 600; font-variant-numeric: tabular-nums; }
      .track {
        position: relative; height: 12px; background: var(--track); border-radius: 3px;
        margin: 6px 0 3px; overflow: hidden;
      }
      .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px 0 0 3px; background: var(--fill); }
      .seg { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(0,0,0,0.35); }
      .now {
        position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--now);
        box-shadow: 0 0 3px rgba(255,255,255,0.6); border-radius: 2px;
      }
      .lim .reset { font-size: 11px; color: var(--dim); }
      .pace { font-size: 11px; float: right; }
      .pace.ok { color: #5ea36a; }
      .pace.hot { color: var(--hot); }
      .surfaces { border-top: 1px solid var(--line); padding-top: 8px; }
      .surfaces h4 { margin: 0 0 6px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--dim); font-weight: 600; }
      .srow { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
      .srow .nm { width: 78px; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .srow .st { flex: 1; height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
      .srow .st i { display: block; height: 100%; background: var(--fill); }
      .srow .vl { width: 44px; text-align: right; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
      footer { padding: 6px 12px 10px; font-size: 10px; color: var(--dim); display: flex; justify-content: space-between; }
      .err { color: var(--hot); }
    </style>
  </head>
  <body>
    <header class="bar-drag">
      <span class="title">Usage Monitor for Claude</span>
      <span class="btns"><span id="open" title="Open full dashboard">⤢</span><span id="close" title="Hide">✕</span></span>
    </header>
    <div class="account">
      <div class="row"><span>Plan</span><b id="plan">—</b></div>
    </div>
    <section id="limits"></section>
    <section class="surfaces">
      <h4>Session — by surface</h4>
      <div id="surfaces"></div>
    </section>
    <footer><span id="upd">loading…</span><span id="open2" style="cursor:pointer">dashboard →</span></footer>

    <script>
      const HOUR = 3600000, DAY = 86400000;
      let snap = null;

      const fmtLeft = (ms) => {
        if (!(ms > 0)) return 'now';
        const h = Math.floor(ms / HOUR), m = Math.floor((ms % HOUR) / 60000);
        return h >= 24 ? `${Math.floor(h / 24)}d ${h % 24}h` : h >= 1 ? `${h}h ${m}m` : `${m}m`;
      };
      const fmtTok = (n) => (n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(0) + 'k' : String(n));

      function limitBar(lbl, percent, resetsAt, spanMs, segments) {
        const msLeft = Date.parse(resetsAt) - Date.now();
        const nowFrac = Math.max(0, Math.min(1, 1 - msLeft / spanMs));
        const fill = Math.max(0, Math.min(100, percent || 0));
        const paceHot = fill / 100 > nowFrac + 0.05;
        const segEls = [];
        for (let i = 1; i < segments; i++) segEls.push(`<div class="seg" style="left:${(i / segments) * 100}%"></div>`);
        return `<div class="lim">
          <div class="top"><span class="lbl">${lbl}</span><span class="pc">${percent}%</span></div>
          <div class="track">
            <div class="fill" style="width:${fill}%"></div>
            ${segEls.join('')}
            <div class="now" style="left:calc(${nowFrac * 100}% - 1px)"></div>
          </div>
          <div class="reset">resets in ${fmtLeft(msLeft)}
            <span class="pace ${paceHot ? 'hot' : 'ok'}">${paceHot ? 'ahead of pace' : 'on pace'} · ${Math.round(nowFrac * 100)}% of window elapsed</span>
          </div>
        </div>`;
      }

      function render() {
        if (!snap) return;
        const L = snap.live;
        document.getElementById('plan').textContent = 'Claude Max (' + L.tier.replace('default_claude_', '').replace('_', ' ') + ')';
        let html = limitBar('Session (5h)', L.session.percent, L.session.resetsAt, 5 * HOUR, 5) +
          limitBar('Weekly (7d)', L.weekly.percent, L.weekly.resetsAt, 7 * DAY, 7);
        if (L.weeklyScoped)
          html += limitBar('Weekly (' + L.weeklyScoped.model + ')', L.weeklyScoped.percent, L.weeklyScoped.resetsAt, 7 * DAY, 7);
        document.getElementById('limits').innerHTML = html;

        const agg = snap.windows.session.agg;
        const max = Math.max(...agg.surfaces.map((s) => s.costShare), 0.01);
        document.getElementById('surfaces').innerHTML = agg.surfaces
          .map((s) => `<div class="srow">
            <span class="nm">${s.surface}</span>
            <span class="st"><i style="width:${(s.costShare / max) * 100}%"></i></span>
            <span class="vl">${fmtTok(s.total)}</span></div>`)
          .join('') || '<div class="srow"><span class="nm">no activity</span></div>';

        if (host) host.postMessage('h:' + Math.ceil(document.body.getBoundingClientRect().height));
        const upd = document.getElementById('upd');
        if (L.stale || L.degraded) {
          const age = L.fetchedAt ? fmtLeft(Date.now() - L.fetchedAt) + ' old' : 'cached';
          upd.innerHTML = '<span class="err">⚠ ' + (L.degraded || 'cached values') + ' · ' + age + '</span>';
        } else {
          upd.textContent = 'updated ' + new Date(snap.generatedAt).toLocaleTimeString('en-CA', { hour12: false });
        }
      }

      async function load() {
        try {
          const r = await fetch('/api/usage');
          snap = await r.json();
          if (snap.error) throw new Error(snap.error);
          render();
        } catch (e) {
          document.getElementById('upd').innerHTML = '<span class="err">error: ' + e.message + '</span>';
        }
      }

      const host = window.chrome && window.chrome.webview;
      const openDash = () => (host ? host.postMessage('open-dashboard') : window.open('/', '_blank'));
      document.getElementById('open').onclick = openDash;
      document.getElementById('open2').onclick = openDash;
      document.getElementById('close').onclick = () => (host ? host.postMessage('hide') : null);

      load();
      setInterval(load, 30000);
      setInterval(render, 15000);
    </script>
  </body>
</html>
