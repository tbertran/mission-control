<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Mission Control</title>
<style>
  :root {
    --bg: #0a0e14;
    --panel: #10151d;
    --line: #1e2733;
    --text: #d6e0ea;
    --dim: #6b7d8f;
    --amber: #ffb454;
    --green: #57d9a3;
    --red: #ff6b6b;
    --cyan: #57c7ff;
    --magenta: #ff7edb;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace;
    font-size: 13.5px;
    overflow: hidden;
    user-select: none;
  }

  /* max-height, never height: with a fixed height scrollHeight floors at the
     container size, so the page can never report that it needs to get smaller. */
  #list { max-height: 100%; overflow-y: auto; padding: 6px; }
  #list::-webkit-scrollbar { width: 8px; }
  #list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    margin: 5px 0;
    cursor: pointer;
    transition: border-color .12s ease;
  }
  .card:hover { border-color: #354254; }
  .card.needs-input { border-color: var(--magenta); box-shadow: 0 0 0 1px var(--magenta) inset; }

  .row1 { display: flex; align-items: center; gap: 8px; }
  .clone { font-weight: 700; color: var(--cyan); letter-spacing: .03em; font-size: 14px; }
  .bell { font-size: 12px; opacity: .75; flex: none; }

  .sdot { width: 13px; height: 13px; border-radius: 50%; flex: none; margin-left: auto; }
  .sdot.working { background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: pulse 1.1s ease-in-out infinite; }
  .sdot.idle { background: var(--green); box-shadow: 0 0 5px var(--green); }
  .sdot.needs { background: var(--magenta); box-shadow: 0 0 8px var(--magenta); animation: pulse .8s ease-in-out infinite; }
  .sdot.background { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  .title {
    color: var(--text); font-weight: 500; margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .row2 { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .activity { flex: 1; color: #b9c6d3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .elapsed { color: var(--dim); font-variant-numeric: tabular-nums; }

  .ctxwrap { display: flex; align-items: center; gap: 6px; margin-top: 7px; }
  .ctxbar { flex: 1; height: 5px; border-radius: 2px; background: #1a2330; overflow: hidden; }
  .ctxfill { height: 100%; background: var(--green); }
  .ctxpct { color: #8fa0b0; width: 32px; text-align: right; font-variant-numeric: tabular-nums; }

  .meta {
    display: flex; gap: 10px; margin-top: 6px; color: var(--dim); font-size: 11.5px;
  }
  .meta .model { flex: none; }
  .meta .model b { color: #93a3b3; font-weight: 600; }
  .meta .branch { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #empty { color: var(--dim); text-align: center; padding: 30px 10px; }

  .gbadge {
    margin-top: 6px;
    background: #1a2330; color: #8fa0b0; border: 1px solid var(--line); border-radius: 10px;
    padding: 2px 8px; font: inherit; font-size: 11px; cursor: pointer;
  }
  .gbadge:hover { border-color: #354254; color: var(--text); }
  .gfiles { margin-top: 6px; border-top: 1px solid var(--line); padding-top: 6px; }
  .gfrow { display: flex; gap: 8px; padding: 2px 0; font-size: 11.5px; }
  .gstatus { flex: none; width: 14px; text-align: center; font-weight: 700; }
  .gstatus.g-A { color: var(--green); }
  .gstatus.g-M { color: var(--amber); }
  .gstatus.g-D { color: var(--red); }
  .gstatus.g-R, .gstatus.g-C { color: var(--cyan); }
  .gpath { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #b9c6d3; }
</style>
</head>
<body>
<div id="list"><div id="empty">No sessions on deck</div></div>
<script>
function fmtElapsed(ms) {
  if (ms == null || ms < 0) return '';
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  if (h > 0) return h + 'h ' + m + 'm';
  if (m > 0) return m + 'm ' + sec + 's';
  return sec + 's';
}

function ctxColor(pct) {
  if (pct == null) return '#3a4756';
  if (pct >= 80) return 'var(--red)';
  if (pct >= 60) return 'var(--amber)';
  return 'var(--green)';
}

function statusClass(s) {
  if (s.needsInput) return 'needs';
  if (s.state === 'idle') return s.backgroundAgents > 0 ? 'background' : 'idle';
  return 'working';
}

let sessions = [];
const expandedGitFiles = new Set();

function fileBasename(p) {
  return p.split(/[/\\]/).pop() || p;
}

function renderGitFiles(files) {
  let rows = '';
  for (const f of files) {
    rows += '<div class="gfrow"><span class="gstatus g-' + f.status + '">' + escapeHtml(f.status) + '</span>'
      + '<span class="gpath" title="' + escapeHtml(f.path) + '">' + escapeHtml(fileBasename(f.path)) + '</span></div>';
  }
  return '<div class="gfiles">' + rows + '</div>';
}

function render() {
  const list = document.getElementById('list');
  const now = Date.now();
  if (sessions.length === 0) {
    list.innerHTML = '<div id="empty">No sessions on deck</div>';
    reportHeight();
    return;
  }

  const groups = new Map();
  for (const s of sessions) {
    if (!groups.has(s.clone)) groups.set(s.clone, []);
    groups.get(s.clone).push(s);
  }

  let html = '';
  for (const [clone, items] of groups) {
    for (const s of items) {
      const cls = statusClass(s);
      const elapsed = fmtElapsed(now - (s.activitySinceMs || now));
      const pct = s.contextPct;
      const cardCls = cls === 'needs' ? 'card needs-input' : 'card';
      html += '<div class="' + cardCls + '" data-cwd="' + escapeHtml(s.cwd || '') + '" data-owner-pid="' + (s.ownerPid || '') + '" data-session-id="' + escapeHtml(s.sessionId || '') + '">'
        + '<div class="row1">'
          + '<span class="clone">' + escapeHtml(clone) + '</span>'
          + (s.needsBell ? '<span class="bell" title="Turn ended">🔔</span>' : '')
          + '<span class="sdot ' + cls + '"></span>'
        + '</div>'
        + '<div class="title">' + escapeHtml(s.title) + '</div>'
        + '<div class="row2">'
          + '<span class="activity">' + escapeHtml(s.activity) + '</span>'
          + '<span class="elapsed">' + elapsed + '</span>'
        + '</div>'
        + '<div class="ctxwrap">'
          + '<div class="ctxbar"><div class="ctxfill" style="width:' + (pct ?? 0) + '%;background:' + ctxColor(pct) + '"></div></div>'
          + '<div class="ctxpct">' + (pct == null ? '—' : pct + '%') + '</div>'
        + '</div>'
        + '<div class="meta">'
          + '<span class="model">' + (s.model ? '<b>' + escapeHtml(s.model) + '</b>' : ' ') + '</span>'
          + '<span class="branch">' + (s.gitBranch ? '⎇ ' + escapeHtml(s.gitBranch) : '') + '</span>'
        + '</div>'
        + (s.gitFiles && s.gitFiles.length
            ? '<button class="gbadge" data-sid="' + escapeHtml(s.sessionId) + '">'
                + s.gitFiles.length + ' file' + (s.gitFiles.length === 1 ? '' : 's') + ' changed'
                + (expandedGitFiles.has(s.sessionId) ? ' ▴' : ' ▾')
              + '</button>'
              + (expandedGitFiles.has(s.sessionId) ? renderGitFiles(s.gitFiles) : '')
            : '')
      + '</div>';
    }
  }
  list.innerHTML = html;
  reportHeight();
}

let lastReportedHeight = 0;
function reportHeight() {
  if (!(window.chrome && window.chrome.webview)) return;
  const h = document.getElementById('list').scrollHeight;
  if (Math.abs(h - lastReportedHeight) < 3) return;
  lastReportedHeight = h;
  window.chrome.webview.postMessage('h:' + h);
}

document.getElementById('list').addEventListener('click', (e) => {
  const badge = e.target.closest('.gbadge');
  if (badge) {
    const sid = badge.getAttribute('data-sid');
    if (expandedGitFiles.has(sid)) expandedGitFiles.delete(sid); else expandedGitFiles.add(sid);
    render();
    return;
  }
  const card = e.target.closest('.card');
  if (!card) return;
  const cwd = card.getAttribute('data-cwd');
  const ownerPid = card.getAttribute('data-owner-pid') || '0';
  const sessionId = card.getAttribute('data-session-id');
  if (sessionId) ackBell(sessionId);
  if (cwd && window.chrome && window.chrome.webview) window.chrome.webview.postMessage('focus:' + ownerPid + '|' + cwd);
});

function ackBell(sessionId) {
  const s = sessions.find((x) => x.sessionId === sessionId);
  if (!s || !s.needsBell) return;
  s.needsBell = false;
  render();
  fetch('/api/ack', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ sessionId }),
  }).catch(() => {});
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

async function poll() {
  try {
    const res = await fetch('/api/sessions');
    const data = await res.json();
    sessions = data.sessions;
  } catch {
    sessions = [];
  }
  render();
}

setInterval(poll, 2500);
setInterval(render, 1000);
poll();
</script>
</body>
</html>
